[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nspark"
version = "0.1.0"
description = "Python client for Newtonian Spark runtime prompt delivery"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Newtonian Spark" }]
keywords = ["prompt", "llm", "ai", "prompt-management", "nspark"]
dependencies = [
    "requests>=2.25",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "responses>=0.23",
]

[project.urls]
Homepage = "https://github.com/sunprema/nspark"

[tool.hatch.build.targets.wheel]
packages = ["src/nspark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
